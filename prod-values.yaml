nameOverride: "hermes-prod"
fullnameOverride: "hermes-prod"

image:
  repository: nousresearch/hermes-agent
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1
strategy:
  type: Recreate

apiServer:
  enabled: true
  host: "0.0.0.0"
  port: 8642

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: api-server
      port: 8642
      targetPort: 8642
      protocol: TCP

config:
  values:
    model:
      default: anthropic/claude-opus-4.6
      provider: auto
      base_url: https://openrouter.ai/api/v1
    agent:
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      tool_use_enforcement: auto
    terminal:
      backend: docker
      cwd: "."
      timeout: 180
    display:
      tool_progress: all
      interim_assistant_messages: true
    browser:
      inactivity_timeout: 120
      command_timeout: 30
      allow_private_urls: false
    compression:
      enabled: true
      threshold: 0.5
      target_ratio: 0.2
      protect_last_n: 20
    security:
      redact_secrets: true
      tirith_enabled: true
      tirith_fail_open: true

secrets:
  OPENROUTER_API_KEY: "your-real-openrouter-api-key-here"
  API_SERVER_KEY: "your-secret-api-server-key-here"

persistence:
  enabled: true
  size: 10Gi
  storageClass: "local-path"
  accessMode: ReadWriteOnce

bootstrap:
  enabled: true
  overwrite: false

soul:
  text: |
    # Hermes Production Agent
    
    You are a professional, helpful AI assistant focused on providing accurate and useful responses.
    
    ## Guidelines
    - Be concise but thorough
    - Use tools when needed (web search, file operations, etc.)
    - Ask for clarification when uncertain  
    - Maintain professional tone
    - Focus on solving the user's problem efficiently

env:
  WEB_TOOLS_DEBUG: "false"
  VISION_TOOLS_DEBUG: "false"
  MOA_TOOLS_DEBUG: "false"
  IMAGE_TOOLS_DEBUG: "false"
  HERMES_HUMAN_DELAY_MODE: "off"
  GATEWAY_ALLOW_ALL_USERS: "false"
  WHATSAPP_ENABLED: "false"