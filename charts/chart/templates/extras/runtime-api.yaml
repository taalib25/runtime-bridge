apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "hermes-runtime-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "hermes-runtime-operator.resourceName" (dict "suffix" "runtime-api" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: api
  selector:
    app.kubernetes.io/name: {{ include "hermes-runtime-operator.name" . }}
    control-plane: controller-manager
  type: ClusterIP
