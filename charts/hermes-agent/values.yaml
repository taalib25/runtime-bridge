nameOverride: ""
fullnameOverride: ""

# Backend-owned business metadata (hermescloud.dev/*), injected by the bridge.
# commonLabels merge into every resource via the hermes-agent.labels helper;
# commonAnnotations are emitted on every resource's metadata.annotations (deployment,
# pod template, service, ingress, pvc, configmap, networkpolicy, serviceaccount, quota/
# limitrange). See docs/label-contract.md.
commonLabels: {}
commonAnnotations: {}

# ResourceQuota + LimitRange — hard-cap the per-tenant namespace to 1 pod and 2 PVCs,
# bounded by the resources block below. Prevents a compromised instance from spawning
# additional workloads (templates/quota.yaml).
resourceQuota:
  enabled: true

image:
  repository: nousresearch/hermes-agent
  # Official upstream tag. The bridge overrides this per-instance; pin a CalVer + digest
  # (e.g. v2026.6.5) for reproducibility once smoke-tested. There is no 0.8.0 published.
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Hermes stores mutable state under HERMES_HOME, so a single replica is the
# safe default when persistence is enabled.
replicaCount: 1
revisionHistoryLimit: 5

strategy:
  type: Recreate

# The official image entrypoint already bootstraps Hermes and execs `hermes`.
# These args become `hermes <args...>`.
command: []
args:
  - gateway
  - run
workingDir: /opt/hermes

bootstrap:
  enabled: true
  # When true, overwrite the persisted config/SOUL with Helm-rendered content.
  # When false, seed only if the file does not already exist in the PVC.
  overwrite: true
  # Optionally consume config bootstrap data from an externally managed
  # ConfigMap instead of the chart-managed one.
  existingConfigMap: ""
  configKey: config.yaml
  soulKey: SOUL.md

config:
  # Raw YAML string rendered via tpl. When non-empty, it takes precedence over
  # config.values.
  raw: ""
  # Partial Hermes config.yaml written into HERMES_HOME/config.yaml.
  values:
    model:
      default: anthropic/claude-opus-4.6
      provider: auto
      base_url: https://openrouter.ai/api/v1
    agent:
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      tool_use_enforcement: auto
    terminal:
      backend: local
      cwd: .
      timeout: 180
    display:
      tool_progress: all
      interim_assistant_messages: true
    browser:
      inactivity_timeout: 120
      command_timeout: 30
      allow_private_urls: false
    compression:
      enabled: true
      threshold: 0.5
      target_ratio: 0.2
      protect_last_n: 20
    security:
      redact_secrets: true
      tirith_enabled: true
      tirith_fail_open: true

soul:
  text: ""

env:
  # s6 stage2 remaps the in-image `hermes` user to these before dropping privileges;
  # HERMES_GID MUST equal podSecurityContext.fsGroup so the dropped process can write the PVC.
  HERMES_UID: "1000"
  HERMES_GID: "1000"
  # Tenant dev-tool persistence. s6 sets subprocess HOME=/opt/data/home (on the PVC), so
  # cargo (~/.cargo), go (~/go), pip --user (~/.local), gem (~/.gem), pnpm, yarn, git/ssh/gh
  # all persist across restarts with NO extra config. The only gap is `npm install -g`
  # (npm's prefix defaults to /usr/local, ephemeral) — point it at /opt/data/.local so global
  # bins land in /opt/data/.local/bin (on the image PATH) → persist AND resolve.
  NPM_CONFIG_PREFIX: "/opt/data/.local"
  WEB_TOOLS_DEBUG: "false"
  VISION_TOOLS_DEBUG: "false"
  MOA_TOOLS_DEBUG: "false"
  IMAGE_TOOLS_DEBUG: "false"
  HERMES_HUMAN_DELAY_MODE: "off"
  HERMES_HUMAN_DELAY_MIN_MS: "800"
  HERMES_HUMAN_DELAY_MAX_MS: "2500"
  GATEWAY_ALLOW_ALL_USERS: "false"
  WHATSAPP_ENABLED: "false"
  WHATSAPP_ALLOWED_USERS: ""
  TELEGRAM_ALLOWED_USERS: ""
  TELEGRAM_HOME_CHANNEL: ""
  DISCORD_ALLOWED_USERS: ""
  DISCORD_HOME_CHANNEL: ""
  SLACK_ALLOWED_USERS: ""
  SIGNAL_ALLOWED_USERS: ""
  SIGNAL_GROUP_ALLOWED_USERS: ""

extraEnv: []
extraEnvFrom: []

secrets:
  existingSecret: ""
  annotations: {}
  OPENROUTER_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GOOGLE_API_KEY: ""
  GEMINI_API_KEY: ""
  GLM_API_KEY: ""
  KIMI_API_KEY: ""
  MINIMAX_API_KEY: ""
  MINIMAX_CN_API_KEY: ""
  HF_TOKEN: ""
  XIAOMI_API_KEY: ""
  AI_GATEWAY_API_KEY: ""
  NOUS_API_KEY: ""
  EXA_API_KEY: ""
  FIRECRAWL_API_KEY: ""
  FAL_KEY: ""
  GROQ_API_KEY: ""
  VOICE_TOOLS_OPENAI_KEY: ""
  API_SERVER_KEY: ""
  TELEGRAM_BOT_TOKEN: ""
  DISCORD_BOT_TOKEN: ""
  SLACK_BOT_TOKEN: ""
  SLACK_APP_TOKEN: ""
  SIGNAL_HTTP_URL: ""
  SIGNAL_ACCOUNT: ""
  BROWSERBASE_API_KEY: ""
  BROWSERBASE_PROJECT_ID: ""
  HONCHO_API_KEY: ""
  TINKER_API_KEY: ""
  WANDB_API_KEY: ""
  GITHUB_TOKEN: ""
  SUDO_PASSWORD: ""
  WEBHOOK_SECRET: ""
  EMAIL_ADDRESS: ""
  EMAIL_PASSWORD: ""
  EMAIL_IMAP_HOST: ""
  EMAIL_IMAP_PORT: ""
  EMAIL_SMTP_HOST: ""
  EMAIL_SMTP_PORT: ""
  MISTRAL_API_KEY: ""
  DINGTALK_CLIENT_ID: ""
  DINGTALK_CLIENT_SECRET: ""
  FEISHU_APP_ID: ""
  FEISHU_APP_SECRET: ""
  FEISHU_ENCRYPT_KEY: ""
  FEISHU_VERIFICATION_TOKEN: ""
  WECOM_BOT_ID: ""
  WECOM_SECRET: ""
  WECOM_CALLBACK_CORP_ID: ""
  WECOM_CALLBACK_CORP_SECRET: ""
  WECOM_CALLBACK_AGENT_ID: ""
  WECOM_CALLBACK_TOKEN: ""
  WECOM_CALLBACK_ENCODING_AES_KEY: ""
  WEIXIN_ACCOUNT_ID: ""
  WEIXIN_TOKEN: ""
  BLUEBUBBLES_SERVER_URL: ""
  BLUEBUBBLES_PASSWORD: ""

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  target:
    name: ""
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        annotations: {}
        labels: {}
  data: []
  dataFrom: []
  annotations: {}
  labels: {}

operator:
  enabled: false
  controllerClass: hermes.ai/default
  installCustomResources: true
  managementNamespace: ""
  defaultChartValues: {}
  tenants: []

tenant:
  id: ""
  labels: {}

apiServer:
  enabled: false
  host: "0.0.0.0"
  port: 8642
  corsOrigins: ""
  modelName: hermes-agent

webhook:
  enabled: false
  port: 8644

telegramWebhook:
  enabled: false
  url: ""
  port: 8443

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

rbac:
  create: false
  clusterWide: false
  annotations: {}
  rules: []

persistence:
  enabled: true
  existingClaim: ""
  mountPath: /opt/data
  accessMode: ReadWriteOnce
  # /opt/data holds config + sessions + memories + lightrag + npm-global (MCP) +
  # playwright cache, all of which grow under load. 5Gi (upstream default) wedges
  # an active agent; 20Gi is the per-tenant baseline (override per plan tier).
  size: 20Gi
  storageClass: ""
  annotations: {}

browser:
  shm:
    enabled: true
    mountPath: /dev/shm
    sizeLimit: 1Gi

service:
  enabled: false
  type: ClusterIP
  annotations: {}
  labels: {}
  sessionAffinity: None
  externalTrafficPolicy: ""
  internalTrafficPolicy: ""
  loadBalancerSourceRanges: []
  # When empty, the chart automatically exposes enabled apiServer/webhook/
  # telegramWebhook listeners using their configured port values. Explicit
  # entries override the defaults.
  # ports:
  #   - name: api-server
  #     port: 8642
  #     targetPort: 8642
  #     containerPort: 8642
  #     protocol: TCP
  ports: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hermes.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  servicePortNumber: null

ingressRoute:
  enabled: false
  traefikApiVersion: "traefik.io/v1alpha1"
  entryPoints:
    - websecure
  tls:
    certResolver: letsencrypt
  cors:
    enabled: false
    origins: []
    allowHeaders:
      - Authorization
      - Content-Type
      - Accept
      - Accept-Encoding
      - User-Agent
      - X-Requested-With
      - X-Stainless-Lang
      - X-Stainless-Package-Version
      - X-Stainless-OS
      - X-Stainless-Arch
      - X-Stainless-Runtime
      - X-Stainless-Runtime-Version
      - X-Stainless-Retry-Count
      - X-Stainless-Timeout
      - OpenAI-Organization
      - OpenAI-Project
  forwardAuth:
    enabled: false
    url: ""

virtualService:
  enabled: false
  gateways: []
  hosts: []
  timeout: "3600s"
  servicePortNumber: null

# NetworkPolicy — the REAL per-tenant isolation boundary. terminal.backend=local runs
# an adversarial LLM in-pod, so this must be on by default. Ported from the
# runtime-node-core chart + hardened per docs/hermes-runtime-migration-plan.md Phase 3c.
# The fork's networkpolicy.yaml renders networkPolicy.ingress/egress verbatim.
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  # Ingress: Traefik (external HTTP/WS) and the bridge (health checks, exec proxy).
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik          # Traefik's actual namespace on kh-test (k3s's bundled Traefik HelmChart installs here, NOT kube-system)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system      # kept in case a different cluster's Traefik runs here instead
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-system    # bridge ClusterIP probes/proxy
  # Egress: DNS + internet (OpenRouter/Anthropic/etc). Cluster-internal CIDRs are excluded
  # to block pod-to-pod lateral movement; 169.254.0.0/16 blocks the cloud metadata endpoint
  # (169.254.169.254) so a compromised agent can't steal node credentials (SSRF).
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16          # k3s flannel pod CIDR
              - 10.43.0.0/16          # k3s service CIDR
              - 169.254.0.0/16        # link-local incl. cloud metadata 169.254.169.254
              # - <node-private-subnet>  # add here if a Hetzner private network is ever used

tenantIsolation:
  enabled: false
  allowSameNamespace: true
  authorizedNamespaces: []
  allowDns: true
  additionalEgress: []
  podAntiAffinity:
    enabled: false
    type: preferredDuringSchedulingIgnoredDuringExecution
    topologyKey: kubernetes.io/hostname

pdb:
  enabled: false
  minAvailable: 1

# Raw probe specs copied onto the container.
# Example HTTP probe for the Hermes API server:
# probes:
#   liveness:
#     httpGet:
#       path: /health
#       port: api-server
# startupProbe owns the slow-boot grace period (up to failureThreshold * periodSeconds =
# 120s) so liveness/readiness don't need a huge initialDelaySeconds of their own — k8s
# doesn't even evaluate liveness/readiness until startupProbe succeeds once. All three
# hit the same /api/status path the bridge's own checkInstanceHealth uses (bridge/status.go),
# so "k8s says Ready" and "bridge says healthy" are the same signal, not two probes that
# can silently disagree (a TCP check passes the instant the port opens, well before the
# app can actually serve a request — that gap is what made pods look "Ready" while still
# unable to answer anything).
probes:
  startup:
    httpGet:
      path: /api/status
      port: 9119
    periodSeconds: 2
    timeoutSeconds: 5
    failureThreshold: 60
  readiness:
    httpGet:
      path: /api/status
      port: 9119
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    httpGet:
      path: /api/status
      port: 9119
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

npmPackages: []

resources:
  requests:
    cpu: 500m
    # Lowered from 1Gi so more instances fit on small test nodes (e.g. kh-test, which
    # only has ~1.2Gi free) — this is the scheduling guarantee, not a hard cap. Keep
    # in sync with INSTANCE_MEMORY_MIB in apps/server's cluster-scheduler.service.ts,
    # which mirrors this value for capacity accounting.
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

terminationGracePeriodSeconds: 120

podAnnotations: {}
deploymentAnnotations: {}
podLabels: {}

# The official nousresearch/hermes-agent image runs s6-overlay (ENTRYPOINT /init). Its
# preinit + privilege drop (s6-setuidgid) require a REAL root start: runAsUser:0,
# runAsNonRoot:false, allowPrivilegeEscalation:true (no_new_privs breaks the drop),
# readOnlyRootFilesystem:false (s6 writes /run; agent installs lazy deps/playwright/npm),
# and capabilities not fully dropped. s6 then drops each service to the `hermes` user
# (remapped to env.HERMES_UID/GID == fsGroup). Strict isolation comes from the per-tenant
# namespace + NetworkPolicy + ResourceQuota, NOT pod-level runAsNonRoot.
podSecurityContext:
  runAsUser: 0
  runAsNonRoot: false
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: true
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  capabilities:
    drop: []
  seccompProfile:
    type: RuntimeDefault

priorityClassName: ""
runtimeClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraVolumes: []
extraVolumeMounts: []
extraInitContainers: []
extraContainers: []
extraObjects: []
