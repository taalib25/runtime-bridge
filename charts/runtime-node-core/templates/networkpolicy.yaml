{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "runtime-node-core.fullname" . }}
  labels:
    {{- include "runtime-node-core.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "runtime-node-core.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Traefik delivers all external HTTP / WebSocket traffic
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.traefikNamespace }}
    # Bridge health checks and exec proxy via ClusterIP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.bridgeNamespace }}

  egress:
    # kube-dns — required for LLM API host resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Internet egress — agents call OpenRouter / Anthropic / etc.
    # Cluster-internal CIDRs are excluded to block pod-to-pod lateral movement.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - {{ .Values.networkPolicy.clusterCIDR }}
              - {{ .Values.networkPolicy.serviceCIDR }}
{{- end }}
