apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "runtime-node-core.fullname" . }}
  labels:
    {{- include "runtime-node-core.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "runtime-node-core.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "runtime-node-core.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.name }}
      {{- end }}
      containers:
        - name: runtime-node
          image: {{ include "runtime-node-core.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
            capabilities:
              drop:
                {{- range .Values.containerSecurityContext.capabilities.drop }}
                - {{ . }}
                {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.runtime.port }}
              protocol: TCP
          env:
            - name: INSTANCE_ID
              value: {{ .Values.runtime.instanceId | quote }}
            - name: HERMES_INFERENCE_PROVIDER
              value: {{ .Values.model.provider | quote }}
            - name: HERMES_MODEL
              value: {{ .Values.model.defaultModel | quote }}
            - name: HERMES_WEBUI_DEFAULT_MODEL
              value: {{ .Values.model.defaultModel | quote }}
            {{- range $key, $value := .Values.runtime.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "runtime-node-core.secretName" . }}
                  key: {{ .Values.secrets.keys.openai }}
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "runtime-node-core.secretName" . }}
                  key: {{ .Values.secrets.keys.anthropic }}
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "runtime-node-core.secretName" . }}
                  key: {{ .Values.secrets.keys.openrouter }}
                  optional: true
            - name: OPENCODE_GO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "runtime-node-core.secretName" . }}
                  key: {{ .Values.secrets.keys.opencode }}
                  optional: true
          volumeMounts:
            - name: state
              mountPath: {{ .Values.persistence.state.mountPath }}
            - name: workspace
              mountPath: {{ .Values.persistence.workspace.mountPath }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" (include "runtime-node-core.fullname" .)) .Values.persistence.state.existingClaim }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-workspace" (include "runtime-node-core.fullname" .)) .Values.persistence.workspace.existingClaim }}
