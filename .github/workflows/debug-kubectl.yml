name: Debug — read-only kubectl

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Cluster to inspect"
        required: true
        type: choice
        options:
          - kh-test
      namespace:
        description: "Namespace to inspect"
        required: true
        type: string

jobs:
  inspect:
    name: Inspect ${{ inputs.namespace }} on ${{ inputs.cluster_id }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.cluster_id }}
    defaults:
      run:
        working-directory: infra/kube-hetzner/clusters/${{ inputs.cluster_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.3"

      - name: tofu init (read state)
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          tofu init \
            -backend-config="endpoint=${{ vars.R2_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}"

      - name: Write kubeconfig
        run: |
          tofu output -raw kubeconfig > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"

      - name: Service
        run: |
          echo "===SERVICE==="
          kubectl get svc "${{ inputs.namespace }}" -n "${{ inputs.namespace }}" -o yaml || true

      - name: Endpoints
        run: |
          echo "===ENDPOINTS==="
          kubectl get endpoints "${{ inputs.namespace }}" -n "${{ inputs.namespace }}" -o yaml || true

      - name: EndpointSlices
        run: |
          echo "===ENDPOINTSLICES==="
          kubectl get endpointslices -n "${{ inputs.namespace }}" -o yaml || true

      - name: Pods with labels
        run: |
          echo "===PODS==="
          kubectl get pod -n "${{ inputs.namespace }}" --show-labels || true
          echo "===POD CONDITIONS==="
          kubectl get pod -n "${{ inputs.namespace }}" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{range .status.conditions[*]}  {.type}={.status} ({.reason}){"\n"}{end}{"\n"}{end}' || true

      - name: Deployment selector
        run: |
          echo "===DEPLOYMENT SELECTOR==="
          kubectl get deployment -n "${{ inputs.namespace }}" -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.spec.selector}{"\n"}{end}' || true

      - name: IngressRoute
        run: |
          echo "===INGRESSROUTE==="
          kubectl get ingressroute -n "${{ inputs.namespace }}" -o yaml || true

      - name: Pod images
        run: |
          echo "===POD IMAGES==="
          kubectl get pod -n "${{ inputs.namespace }}" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{range .status.containerStatuses[*]}  {.name}: {.image} ({.imageID}){"\n"}{end}{"\n"}{end}' || true

      - name: Live chart file on bridge pod
        run: |
          echo "===LIVE CHART FILE==="
          POD=$(kubectl get pod -n "${{ inputs.namespace }}" -l app.kubernetes.io/name=hermes-bridge -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ]; then
            kubectl cp "${{ inputs.namespace }}/$POD:/charts/hermes-agent/templates/ingressroute.yaml" /tmp/live-ingressroute.yaml 2>&1 || true
            cat /tmp/live-ingressroute.yaml 2>&1 || true
          else
            echo "no bridge pod found in this namespace"
          fi

      - name: Traefik pods and recent logs (cluster-wide)
        run: |
          echo "===ALL PODS CLUSTER-WIDE (searching for traefik)==="
          kubectl get pod -A -o wide | grep -i traefik || true
          echo "===TRAEFIK RECENT LOGS==="
          kubectl logs -n traefik -l app.kubernetes.io/name=traefik --tail=300 || true
          echo "===TRAEFIK ACME/CERT STORAGE==="
          TPOD=$(kubectl get pod -n traefik -l app.kubernetes.io/name=traefik -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$TPOD" ]; then
            kubectl get pod -n traefik "$TPOD" -o yaml | grep -A20 "args:" || true
          fi

      - name: Instance pod env (names/refs only, never secret values)
        run: |
          echo "===INSTANCE POD ENV (env names + secretKeyRef refs, no literal secret values)==="
          IPOD=$(kubectl get pod -n "${{ inputs.namespace }}" -l app.kubernetes.io/name=hermes-agent -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$IPOD" ]; then
            kubectl get pod -n "${{ inputs.namespace }}" "$IPOD" -o jsonpath='{range .spec.containers[*]}-- container: {.name} --{"\n"}{range .env[*]}  {.name} = {.value}{.valueFrom.secretKeyRef.name}{"/"}{.valueFrom.secretKeyRef.key}{"\n"}{end}{"\n"}{range .envFrom[*]}  envFrom secretRef: {.secretRef.name}{"\n"}{end}{"\n"}{end}'
          else
            echo "no instance pod found"
          fi

      - name: Instance Secret key names (never values)
        run: |
          echo "===INSTANCE SECRET KEYS (names + byte counts only, via kubectl describe)==="
          for s in $(kubectl get secret -n "${{ inputs.namespace }}" -o jsonpath='{.items[*].metadata.name}'); do
            echo "-- secret: $s --"
            kubectl describe secret -n "${{ inputs.namespace }}" "$s" | sed -n '/^Data/,$p' || true
          done
