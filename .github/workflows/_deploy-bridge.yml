name: Deploy Bridge (reusable)

on:
  workflow_call:
    inputs:
      cluster_name:
        required: true
        type: string
      region:
        required: true
        type: string
      git_sha:
        required: false
        type: string
        default: ''
        description: Pre-built image SHA — skips Docker build when set (build-once pattern)
      # P5: pass https://bridge-<cluster>.hermeshq.net once CF DNS is configured per cluster
      bridge_url:
        required: false
        type: string
        default: ''
        description: Bridge URL registered with backend — defaults to http://<NODE_IP>:8080
    secrets:
      NODE_IP:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      BRIDGE_SECRET:
        required: true
      GHCR_PAT:
        required: true
      ADMIN_API_SECRET:
        required: true

env:
  IMAGE: ghcr.io/taalib25/hermes-bridge

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          if [ -n "${{ inputs.git_sha }}" ]; then
            echo "sha=${{ inputs.git_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.NODE_IP }} >> ~/.ssh/known_hosts

      # ── Private registry auth ────────────────────────────────────────────
      # Write k3s registries.yaml once so containerd pulls from ghcr.io
      # automatically — no imagePullSecrets in manifests, no SSH pipe.
      - name: Configure k3s private registry (ghcr.io)
        run: |
          ssh root@${{ secrets.NODE_IP }} bash << 'ENDSSH'
            mkdir -p /etc/rancher/k3s
            cat > /etc/rancher/k3s/registries.yaml << EOF
          configs:
            "ghcr.io":
              auth:
                username: taalib25
                password: ${{ secrets.GHCR_PAT }}
          EOF
            # Restart k3s only when the file actually changed
            if ! cmp -s /etc/rancher/k3s/registries.yaml.prev /etc/rancher/k3s/registries.yaml 2>/dev/null; then
              cp /etc/rancher/k3s/registries.yaml /etc/rancher/k3s/registries.yaml.prev
              systemctl restart k3s
              sleep 10
            fi
          ENDSSH

      # ── Build & push bridge image to private GHCR ────────────────────────
      - uses: actions/setup-go@v5
        if: inputs.git_sha == ''
        with:
          go-version-file: go.mod
          cache: true

      - name: Log in to GHCR
        if: inputs.git_sha == ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: taalib25
          password: ${{ secrets.GHCR_PAT }}

      # The default buildx "docker" driver cannot export a registry cache
      # (cache-to: type=registry). Set up a docker-container driver builder,
      # which supports registry cache import/export.
      - name: Set up Docker Buildx
        if: inputs.git_sha == ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push bridge image
        if: inputs.git_sha == ''
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:latest
          build-args: GIT_SHA=${{ steps.tag.outputs.sha }}
          # Layer cache — cuts build time by ~60% on repeated runs
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # ── Enable maintenance mode before touching anything ─────────────────
      # Prevents new creates racing a mid-deploy bridge restart.
      - name: Enable maintenance mode
        run: |
          SECRET="${{ secrets.BRIDGE_SECRET }}"
          ssh root@${{ secrets.NODE_IP }} "
            curl -sf -X PUT http://localhost:8080/v1/cluster/maintenance \
              -H 'X-Bridge-Secret: $SECRET' \
              -H 'Content-Type: application/json' \
              -d '{\"enabled\": true}' || true
          "

      # ── Apply manifests ───────────────────────────────────────────────────
      - name: Apply manifests
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          GIT_SHA: ${{ steps.tag.outputs.sha }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
        run: |
          # Render deployment with correct cluster name + image tag
          sed \
            -e "s|ghcr.io/taalib25/hermes-bridge:__GIT_SHA__|${IMAGE}:${GIT_SHA}|g" \
            -e "s|value: \"hermes-test\"|value: \"${CLUSTER_NAME}\"|g" \
            deploy/deployment-test.yaml > /tmp/deployment.yaml

          scp deploy/rbac.yaml deploy/service.yaml /tmp/deployment.yaml \
            root@${{ secrets.NODE_IP }}:/tmp/

          ssh root@${{ secrets.NODE_IP }} "
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            kubectl create namespace hermes-bridge --dry-run=client -o yaml | kubectl apply -f -

            kubectl -n hermes-bridge create secret generic bridge-auth \
              --from-literal=secret=${BRIDGE_SECRET} \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply -f /tmp/rbac.yaml
            kubectl apply -f /tmp/service.yaml
            kubectl apply -f /tmp/deployment.yaml
          "

      # ── Rollout — k3s pulls the image from GHCR automatically ────────────
      - name: Rollout and wait
        run: |
          ssh root@${{ secrets.NODE_IP }} "
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            kubectl rollout restart deployment/hermes-bridge -n hermes-bridge
            kubectl rollout status deployment/hermes-bridge -n hermes-bridge --timeout=120s
          "

      # ── Disable maintenance mode (always runs, even on failure) ──────────
      - name: Disable maintenance mode
        if: always()
        run: |
          SECRET="${{ secrets.BRIDGE_SECRET }}"
          ssh root@${{ secrets.NODE_IP }} "
            curl -sf -X PUT http://localhost:8080/v1/cluster/maintenance \
              -H 'X-Bridge-Secret: $SECRET' \
              -H 'Content-Type: application/json' \
              -d '{\"enabled\": false}' || true
          " || true

      # ── Smoke test ────────────────────────────────────────────────────────
      - name: Smoke test
        run: |
          ssh root@${{ secrets.NODE_IP }} bash << 'ENDSSH'
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            SECRET=$(kubectl -n hermes-bridge get secret bridge-auth \
              -o jsonpath='{.data.secret}' | base64 -d)

            curl -sf -H "X-Bridge-Secret: $SECRET" \
              http://localhost:8080/healthz | grep '"status":"ok"'
            curl -sf -H "X-Bridge-Secret: $SECRET" \
              http://localhost:8080/readyz | grep '"status":"ready"'
            curl -sf -H "X-Bridge-Secret: $SECRET" \
              http://localhost:8080/v1/cluster/summary | grep '"kubernetesReachable":true'

            echo "Smoke test passed"
          ENDSSH

      # ── Prune old images ──────────────────────────────────────────────────
      - name: Prune old images
        run: |
          ssh root@${{ secrets.NODE_IP }} /usr/local/bin/hermescloud-cleanup || true

      # ── Register cluster with backend ─────────────────────────────────────
      - name: Register cluster with backend
        run: |
          BRIDGE_URL="${{ inputs.bridge_url }}"
          # P5: production clusters pass inputs.bridge_url = https://bridge-<cluster>.hermeshq.net
          BRIDGE_URL="${BRIDGE_URL:-http://${{ secrets.NODE_IP }}:8080}"
          curl -sf -X POST https://api.hermeshq.net/api/admin/clusters \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"cluster_id\":    \"${{ inputs.cluster_name }}\",
              \"bridge_url\":    \"${BRIDGE_URL}\",
              \"bridge_secret\": \"${{ secrets.BRIDGE_SECRET }}\",
              \"region\":        \"${{ inputs.region }}\",
              \"status\":        \"active\"
            }"
