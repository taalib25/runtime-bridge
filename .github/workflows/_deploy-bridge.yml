name: Deploy Bridge (reusable)

on:
  workflow_call:
    inputs:
      cluster_name:
        required: true
        type: string
      region:
        required: true
        type: string
    secrets:
      DOPPLER_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      TUNNEL_HOST: ssh.${{ inputs.cluster_name }}.hermeshq.net
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Doppler CLI
        run: |
          curl -Ls https://cli.doppler.com/install.sh | sh

      - name: Load secrets from Doppler
        run: doppler secrets download --no-file --format=env >> "$GITHUB_ENV"

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Configure SSH via tunnel
        run: |
          mkdir -p ~/.ssh
          doppler secrets get SSH_PRIVATE_KEY --plain > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host ${{ env.TUNNEL_HOST }}
            User root
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname ${{ env.TUNNEL_HOST }}
          EOF

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build bridge image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ steps.tag.outputs.sha }} \
            -t hermes-bridge:${{ steps.tag.outputs.sha }} \
            .

      - name: Load image into k3s
        run: |
          docker save hermes-bridge:${{ steps.tag.outputs.sha }} | \
            ssh ${{ env.TUNNEL_HOST }} "k3s ctr images import -"

      - name: Pull runtime image on node
        run: |
          ssh ${{ env.TUNNEL_HOST }} \
            "k3s ctr images pull \
              --user taalib25:${GHCR_PAT} \
              ghcr.io/taalib25/runtime-node-core:latest"

      - name: Render and apply manifests
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          GIT_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          sed \
            -e "s|hermes-bridge:__GIT_SHA__|hermes-bridge:${GIT_SHA}|g" \
            -e "s|value: \"hermes-test\"|value: \"${CLUSTER_NAME}\"|g" \
            deploy/deployment-test.yaml > /tmp/deployment.yaml

          scp deploy/rbac.yaml ${{ env.TUNNEL_HOST }}:/tmp/rbac.yaml
          scp deploy/service.yaml ${{ env.TUNNEL_HOST }}:/tmp/service.yaml
          scp /tmp/deployment.yaml ${{ env.TUNNEL_HOST }}:/tmp/deployment.yaml

          ssh ${{ env.TUNNEL_HOST }} "
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            kubectl create namespace hermes-bridge --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n hermes-bridge create secret generic bridge-auth \
              --from-literal=secret=${BRIDGE_SECRET} \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply -f /tmp/rbac.yaml
            kubectl apply -f /tmp/service.yaml
            kubectl apply -f /tmp/deployment.yaml
          "

      - name: Restart and wait for rollout
        run: |
          ssh ${{ env.TUNNEL_HOST }} "
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            kubectl rollout restart deployment/hermes-bridge -n hermes-bridge
            kubectl rollout status deployment/hermes-bridge -n hermes-bridge --timeout=120s
          "

      - name: Smoke test
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
        run: |
          ssh ${{ env.TUNNEL_HOST }} bash << 'EOF'
            SECRET=$(KUBECONFIG=/etc/rancher/k3s/k3s.yaml \
              kubectl -n hermes-bridge get secret bridge-auth \
              -o jsonpath='{.data.secret}' | base64 -d)

            curl -sf -H "X-Bridge-Secret: $SECRET" \
              http://localhost:8080/healthz | grep '"status":"ok"'
            curl -sf -H "X-Bridge-Secret: $SECRET" \
              http://localhost:8080/readyz | grep '"status":"ready"'

            echo "Smoke test passed for cluster: $CLUSTER_NAME"
          EOF

      - name: Register cluster with backend
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          REGION: ${{ inputs.region }}
        run: |
          curl -sf -X POST https://api.hermeshq.net/api/admin/clusters \
            -H "Authorization: Bearer ${ADMIN_API_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{
              \"cluster_id\":    \"${CLUSTER_NAME}\",
              \"bridge_url\":    \"http://${NODE_IP}:8080\",
              \"bridge_secret\": \"${BRIDGE_SECRET}\",
              \"region\":        \"${REGION}\",
              \"status\":        \"active\"
            }"
