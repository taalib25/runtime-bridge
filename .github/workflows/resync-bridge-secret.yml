name: Resync bridge secret → backend

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: Cluster ID to resync (e.g. kh-test)
        required: true
        default: kh-test
        type: string

jobs:
  resync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/kube-hetzner/clusters/${{ inputs.cluster_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.3"

      - name: tofu init (read-only — fetches kubeconfig from state)
        run: |
          tofu init \
            -backend-config="endpoint=${{ vars.R2_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}"

      - name: Export kubeconfig from state
        run: |
          tofu output -raw kubeconfig > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"
          echo "BRIDGE_URL=$(tofu output -raw bridge_url)" >> "$GITHUB_ENV"
          echo "RUNTIME_BASE_DOMAIN=$(tofu output -raw runtime_base_domain)" >> "$GITHUB_ENV"

      - name: Read bridge secret from cluster
        run: |
          BRIDGE_SECRET=$(kubectl get secret bridge-auth -n hermes-system \
            -o jsonpath='{.data.secret}' | base64 -d)
          echo "BRIDGE_SECRET=$BRIDGE_SECRET" >> "$GITHUB_ENV"
          echo "✅ Bridge secret read from cluster (length=${#BRIDGE_SECRET})"

      - name: Re-register cluster with backend
        run: |
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST https://api.hermeshq.net/api/admin/clusters \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"cluster_id\":          \"${{ inputs.cluster_id }}\",
              \"bridge_url\":          \"$BRIDGE_URL\",
              \"bridge_secret\":       \"$BRIDGE_SECRET\",
              \"runtime_base_domain\": \"$RUNTIME_BASE_DOMAIN\",
              \"region\":              \"eu\",
              \"status\":              \"active\"
            }")
          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.json
          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] || exit 1
          echo "✅ Cluster re-registered — heartbeat will recover on next poll"
