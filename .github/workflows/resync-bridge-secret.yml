name: Resync bridge secret → backend

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: Cluster ID to resync (e.g. kh-test)
        required: true
        default: kh-test
        type: string
      bridge_url:
        description: Bridge URL (leave blank to use default for cluster_id)
        required: false
        default: ''
        type: string
      runtime_base_domain:
        description: Runtime base domain (leave blank to use default for cluster_id)
        required: false
        default: ''
        type: string

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - name: Re-register cluster with backend
        env:
          CLUSTER_ID: ${{ inputs.cluster_id }}
          BRIDGE_URL_INPUT: ${{ inputs.bridge_url }}
          RUNTIME_BASE_DOMAIN_INPUT: ${{ inputs.runtime_base_domain }}
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
        run: |
          # Derive defaults from cluster_id if not overridden
          BRIDGE_URL="${BRIDGE_URL_INPUT:-https://bridge-${CLUSTER_ID}.hermeshq.net}"
          RUNTIME_BASE_DOMAIN="${RUNTIME_BASE_DOMAIN_INPUT:-runtime-${CLUSTER_ID}.hermeshq.net}"

          echo "Cluster:       $CLUSTER_ID"
          echo "Bridge URL:    $BRIDGE_URL"
          echo "Runtime domain: $RUNTIME_BASE_DOMAIN"

          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST https://api.hermeshq.net/api/admin/clusters \
            -H "Authorization: Bearer $ADMIN_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{
              \"cluster_id\":          \"$CLUSTER_ID\",
              \"bridge_url\":          \"$BRIDGE_URL\",
              \"bridge_secret\":       \"$BRIDGE_SECRET\",
              \"runtime_base_domain\": \"$RUNTIME_BASE_DOMAIN\",
              \"region\":              \"eu\",
              \"status\":              \"active\"
            }")

          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.json
          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] \
            && echo "✅ Cluster re-registered — heartbeat will recover on next poll" \
            || (echo "❌ Registration failed" && exit 1)
