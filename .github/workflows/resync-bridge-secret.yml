name: Resync bridge secret → backend

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: Cluster ID to resync (e.g. kh-test)
        required: true
        default: kh-test
        type: string
      bridge_url:
        description: Bridge URL (leave blank to use default for cluster_id)
        required: false
        default: ''
        type: string
      runtime_base_domain:
        description: Runtime base domain (leave blank to use default for cluster_id)
        required: false
        default: ''
        type: string

jobs:
  resync:
    runs-on: ubuntu-latest
    environment: ${{ inputs.cluster_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.3"

      - name: Get kubeconfig from state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        working-directory: infra/kube-hetzner/clusters/${{ inputs.cluster_id }}
        run: |
          tofu init \
            -backend-config="endpoint=${{ vars.R2_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}"
          tofu output -raw kubeconfig > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"

      - name: Read bridge-auth secret from cluster
        id: read_secret
        run: |
          # Try hermes-system first (provision workflow namespace), fallback to hermes-bridge
          for NS in hermes-system hermes-bridge; do
            SECRET=$(kubectl get secret bridge-auth -n "$NS" \
              -o jsonpath='{.data.secret}' 2>/dev/null | base64 -d 2>/dev/null)
            if [ -n "$SECRET" ]; then
              echo "Found bridge-auth in namespace: $NS"
              echo "Secret length: ${#SECRET}"
              # Mask the value so it doesn't appear in logs
              echo "::add-mask::$SECRET"
              echo "bridge_secret=$SECRET" >> "$GITHUB_OUTPUT"
              echo "bridge_ns=$NS" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          if [ -z "$(cat $GITHUB_OUTPUT | grep bridge_secret)" ]; then
            echo "ERROR: bridge-auth secret not found in any namespace"
            exit 1
          fi

      - name: Re-register cluster with backend using cluster's actual secret
        env:
          CLUSTER_ID: ${{ inputs.cluster_id }}
          BRIDGE_URL_INPUT: ${{ inputs.bridge_url }}
          RUNTIME_BASE_DOMAIN_INPUT: ${{ inputs.runtime_base_domain }}
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
          BRIDGE_SECRET: ${{ steps.read_secret.outputs.bridge_secret }}
        run: |
          BRIDGE_URL="${BRIDGE_URL_INPUT:-https://bridge-${CLUSTER_ID}.hermeshq.net}"
          RUNTIME_BASE_DOMAIN="${RUNTIME_BASE_DOMAIN_INPUT:-runtime-${CLUSTER_ID}.hermeshq.net}"

          echo "Cluster:        $CLUSTER_ID"
          echo "Bridge URL:     $BRIDGE_URL"
          echo "Runtime domain: $RUNTIME_BASE_DOMAIN"
          echo "Secret source:  namespace=${{ steps.read_secret.outputs.bridge_ns }}"

          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST https://api.hermeshq.net/api/admin/clusters \
            -H "Authorization: Bearer $ADMIN_API_SECRET" \
            -H "Content-Type: application/json" \
            -d "{
              \"cluster_id\":          \"$CLUSTER_ID\",
              \"bridge_url\":          \"$BRIDGE_URL\",
              \"bridge_secret\":       \"$BRIDGE_SECRET\",
              \"runtime_base_domain\": \"$RUNTIME_BASE_DOMAIN\",
              \"region\":              \"eu\",
              \"status\":              \"active\"
            }")

          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.json
          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] \
            && echo "✅ Cluster re-registered — heartbeat will recover on next poll" \
            || (echo "❌ Registration failed" && exit 1)
