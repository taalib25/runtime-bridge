name: Provision runtime cluster

on:
  workflow_dispatch:
    inputs:
      cluster_id:
        description: "Runtime cluster to provision"
        required: true
        type: choice
        options:
          - kh-test
          - eu-1
          - eu-2
      action:
        description: "Plan only, or plan + apply"
        required: true
        type: choice
        options:
          - plan
          - apply
      confirm_apply:
        description: "For eu-1/eu-2 apply: type the cluster_id again to confirm"
        required: false
        default: ""

jobs:
  guard:
    name: Confirm production apply
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation for production clusters
        run: |
          CLUSTER="${{ inputs.cluster_id }}"
          ACTION="${{ inputs.action }}"
          CONFIRM="${{ inputs.confirm_apply }}"
          if [[ "$ACTION" == "apply" && ( "$CLUSTER" == "eu-1" || "$CLUSTER" == "eu-2" ) ]]; then
            if [[ "$CONFIRM" != "$CLUSTER" ]]; then
              echo "❌ Production apply requires confirm_apply == cluster_id"
              echo "   cluster_id:    $CLUSTER"
              echo "   confirm_apply: $CONFIRM"
              exit 1
            fi
            echo "✅ Production apply confirmed for $CLUSTER"
          else
            echo "✅ Guard passed (kh-test or plan-only)"
          fi

  tofu-plan:
    name: OpenTofu plan — ${{ inputs.cluster_id }}
    needs: guard
    runs-on: ubuntu-latest
    environment: ${{ inputs.cluster_id }}
    defaults:
      run:
        working-directory: infra/kube-hetzner/clusters/${{ inputs.cluster_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Check MicroOS snapshot exists
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz \
            | tar -xz hcloud
          sudo mv hcloud /usr/local/bin/hcloud
          COUNT=$(hcloud image list --type snapshot --architecture x86 \
            --selector microos-snapshot=yes --output json | jq length)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No MicroOS x86 snapshot found in Hetzner project."
            echo "   Run the 'Create MicroOS snapshot' workflow first, then re-run this workflow."
            exit 1
          fi
          echo "✅ MicroOS snapshot exists ($COUNT found)"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.3"

      - name: Derive SSH public key from private key
        run: |
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa
          SSH_PUBLIC_KEY=$(ssh-keygen -y -f /tmp/id_rsa)
          echo "TF_VAR_ssh_public_key=$SSH_PUBLIC_KEY" >> "$GITHUB_ENV"
          rm -f /tmp/id_rsa

      - name: tofu init
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_hcloud_token:       ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_private_key:    ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          tofu init \
            -backend-config="endpoint=${{ vars.R2_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}"

      - name: Import pre-existing Hetzner resources
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_hcloud_token:       ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_private_key:    ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HCLOUD_TOKEN:              ${{ secrets.HCLOUD_TOKEN }}
        run: |
          # If the SSH key already exists in Hetzner (from a prior cluster),
          # import it so tofu won't try to create it again (uniqueness_error).
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa
          # Use MD5 fingerprint — Hetzner stores keys by MD5
          SSH_FINGERPRINT=$(ssh-keygen -l -E md5 -f /tmp/id_rsa | awk '{print $2}' | sed 's/MD5://')
          rm -f /tmp/id_rsa
          echo "Looking for SSH key with fingerprint: $SSH_FINGERPRINT"

          SSH_KEY_ID=$(hcloud ssh-key list --output json \
            | jq -r --arg fp "$SSH_FINGERPRINT" \
              '.[] | select(.fingerprint == $fp) | .id // empty')

          if [ -n "$SSH_KEY_ID" ]; then
            echo "Found existing Hetzner SSH key ID $SSH_KEY_ID — importing into state"
            # Backend already initialised by tofu init — no -backend-config needed
            tofu import \
              'module.kh_test.module.kube_hetzner.hcloud_ssh_key.k3s[0]' \
              "$SSH_KEY_ID" || echo "Import skipped (already in state or not applicable)"
          else
            echo "No existing SSH key found — will create during apply"
          fi

      - name: tofu fmt check
        run: tofu fmt -check -recursive

      - name: tofu validate
        env:
          TF_VAR_hcloud_token:       ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_private_key:    ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: tofu validate

      - name: tofu plan
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_hcloud_token:       ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_private_key:    ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: tofu plan -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.cluster_id }}-${{ github.run_id }}
          path: infra/kube-hetzner/clusters/${{ inputs.cluster_id }}/tfplan
          retention-days: 1

  tofu-apply:
    name: OpenTofu apply — ${{ inputs.cluster_id }}
    needs: tofu-plan
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.cluster_id }}
    defaults:
      run:
        working-directory: infra/kube-hetzner/clusters/${{ inputs.cluster_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.3"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.cluster_id }}-${{ github.run_id }}
          path: infra/kube-hetzner/clusters/${{ inputs.cluster_id }}

      - name: Derive SSH public key
        run: |
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa
          SSH_PUBLIC_KEY=$(ssh-keygen -y -f /tmp/id_rsa)
          echo "TF_VAR_ssh_public_key=$SSH_PUBLIC_KEY" >> "$GITHUB_ENV"
          rm -f /tmp/id_rsa

      - name: tofu init
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          tofu init \
            -backend-config="endpoint=${{ vars.R2_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}"

      - name: tofu apply
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_hcloud_token:       ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_private_key:    ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: tofu apply tfplan

      - name: Export tofu outputs
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: tofu output -json > tofu-outputs.json

      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: tofu-outputs-${{ inputs.cluster_id }}-${{ github.run_id }}
          path: infra/kube-hetzner/clusters/${{ inputs.cluster_id }}/tofu-outputs.json
          retention-days: 7

      - name: Summary
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          BRIDGE_URL=$(tofu output -raw bridge_url)
          INGRESS_IP=$(tofu output -raw ingress_ip)
          RUNTIME_DOMAIN=$(tofu output -raw runtime_base_domain)
          echo "## Cluster provisioned: ${{ inputs.cluster_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bridge URL | \`$BRIDGE_URL\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ingress IP | \`$INGRESS_IP\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime domain | \`$RUNTIME_DOMAIN\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| State key | \`clusters/${{ inputs.cluster_id }}/tofu.tfstate\` |" >> "$GITHUB_STEP_SUMMARY"

  bridge-deploy:
    name: Deploy bridge — ${{ inputs.cluster_id }}
    needs: tofu-apply
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.cluster_id }}
    outputs:
      bridge_url: ${{ steps.capture.outputs.bridge_url }}
      runtime_base_domain: ${{ steps.capture.outputs.runtime_base_domain }}
    defaults:
      run:
        working-directory: infra/kube-hetzner/clusters/${{ inputs.cluster_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.3"

      - name: tofu init (read state)
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          tofu init \
            -backend-config="endpoint=${{ vars.R2_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}"

      - name: Write kubeconfig and capture outputs
        id: capture
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          tofu output -raw kubeconfig > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"
          BRIDGE_URL=$(tofu output -raw bridge_url)
          RUNTIME_BASE_DOMAIN=$(tofu output -raw runtime_base_domain)
          echo "bridge_url=$BRIDGE_URL" >> "$GITHUB_OUTPUT"
          echo "runtime_base_domain=$RUNTIME_BASE_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "BRIDGE_URL=$BRIDGE_URL" >> "$GITHUB_ENV"
          echo "RUNTIME_BASE_DOMAIN=$RUNTIME_BASE_DOMAIN" >> "$GITHUB_ENV"

      - name: Verify cluster API reachable
        run: kubectl cluster-info

      - name: Configure GHCR pull secret
        env:
          BRIDGE_NAMESPACE: hermes-system
        run: |
          kubectl create namespace "$BRIDGE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=${{ github.repository_owner }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --namespace="$BRIDGE_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create bridge-auth secret
        env:
          BRIDGE_NAMESPACE: hermes-system
        run: |
          kubectl create secret generic bridge-auth \
            --from-literal=secret=${{ secrets.BRIDGE_SECRET }} \
            --namespace="$BRIDGE_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply RBAC and Service
        env:
          BRIDGE_NAMESPACE: hermes-system
        working-directory: ${{ github.workspace }}
        run: |
          sed "s/namespace: hermes-bridge/namespace: $BRIDGE_NAMESPACE/g" deploy/rbac.yaml \
            | kubectl apply -f -
          sed "s/namespace: hermes-bridge/namespace: $BRIDGE_NAMESPACE/g" deploy/service.yaml \
            | kubectl apply -f -

      - name: Apply Deployment
        env:
          BRIDGE_NAMESPACE: hermes-system
          CLUSTER_ID: ${{ inputs.cluster_id }}
        working-directory: ${{ github.workspace }}
        run: |
          sed \
            -e "s/namespace: hermes-bridge/namespace: $BRIDGE_NAMESPACE/g" \
            -e "s/__BRIDGE_IMAGE__/latest/g" \
            -e "s/__CLUSTER_ID__/$CLUSTER_ID/g" \
            -e "s/__BRIDGE_NAMESPACE__/$BRIDGE_NAMESPACE/g" \
            -e "s/__RUNTIME_BASE_DOMAIN__/$RUNTIME_BASE_DOMAIN/g" \
            deploy/deployment.yaml | kubectl apply -f -
          # Force re-pull in case :latest was updated since last deploy
          kubectl rollout restart deployment/hermes-bridge -n "$BRIDGE_NAMESPACE"

      - name: Apply Ingress
        env:
          BRIDGE_NAMESPACE: hermes-system
          CLUSTER_ID: ${{ inputs.cluster_id }}
        working-directory: ${{ github.workspace }}
        run: |
          sed \
            -e "s/namespace: hermes-bridge/namespace: $BRIDGE_NAMESPACE/g" \
            -e "s/__CLUSTER_NAME__/$CLUSTER_ID/g" \
            deploy/ingress.yaml | kubectl apply -f -

      - name: Wait for rollout
        env:
          BRIDGE_NAMESPACE: hermes-system
        run: |
          kubectl rollout status deployment/hermes-bridge -n "$BRIDGE_NAMESPACE" --timeout=180s

  validate-cluster:
    name: Validate cluster — ${{ inputs.cluster_id }}
    needs: bridge-deploy
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.cluster_id }}
    defaults:
      run:
        working-directory: infra/kube-hetzner/clusters/${{ inputs.cluster_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.3"

      - name: Write kubeconfig
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          tofu init \
            -backend-config="endpoint=${{ vars.R2_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}"
          tofu output -raw kubeconfig > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> "$GITHUB_ENV"

      - name: Check nodes ready
        run: |
          kubectl get nodes
          NOT_READY=$(kubectl get nodes --no-headers | grep -v " Ready" | wc -l)
          if [ "$NOT_READY" -gt 0 ]; then
            echo "❌ $NOT_READY node(s) not Ready"
            exit 1
          fi
          echo "✅ All nodes Ready"

      - name: Check bridge deployment ready
        run: |
          kubectl get deployment hermes-bridge -n hermes-system
          READY=$(kubectl get deployment hermes-bridge -n hermes-system \
            -o jsonpath='{.status.readyReplicas}')
          if [ "${READY:-0}" -lt 1 ]; then
            echo "❌ Bridge deployment has no ready replicas"
            kubectl describe deployment hermes-bridge -n hermes-system
            exit 1
          fi
          echo "✅ Bridge deployment ready ($READY replica(s))"

      - name: Check StorageClass exists
        run: |
          COUNT=$(kubectl get storageclass --no-headers | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No StorageClass found"
            exit 1
          fi
          echo "✅ StorageClass exists:"
          kubectl get storageclass

      - name: Bridge health checks
        env:
          BRIDGE_URL: ${{ needs.bridge-deploy.outputs.bridge_url }}
        run: |
          # Allow up to 60s for DNS and TLS to stabilise after deploy
          for i in $(seq 1 12); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              "$BRIDGE_URL/healthz" 2>/dev/null) && break || true
            echo "Attempt $i: got $STATUS — retrying in 5s"
            sleep 5
          done

          curl -sf "$BRIDGE_URL/healthz" | grep -q '"status":"ok"'
          echo "✅ /healthz ok"

          curl -sf "$BRIDGE_URL/readyz" | grep -q '"status":"ready"'
          echo "✅ /readyz ok"

  register-backend:
    name: Register with backend — ${{ inputs.cluster_id }}
    needs: [bridge-deploy, validate-cluster]
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.cluster_id }}
    defaults:
      run:
        working-directory: infra/kube-hetzner/clusters/${{ inputs.cluster_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.10.3"

      - name: Get ingress IP from state
        id: ip
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          tofu init \
            -backend-config="endpoint=${{ vars.R2_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}"
          INGRESS_IP=$(tofu output -raw ingress_ip)
          echo "ingress_ip=$INGRESS_IP" >> "$GITHUB_OUTPUT"

      - name: Register cluster with backend
        env:
          BRIDGE_URL: ${{ needs.bridge-deploy.outputs.bridge_url }}
          RUNTIME_BASE_DOMAIN: ${{ needs.bridge-deploy.outputs.runtime_base_domain }}
          INGRESS_IP: ${{ steps.ip.outputs.ingress_ip }}
          BACKEND_TOKEN: ${{ secrets.BACKEND_REGISTER_TOKEN }}
        run: |
          if [ -z "$BACKEND_TOKEN" ]; then
            echo "⚠️  BACKEND_REGISTER_TOKEN not set — skipping backend registration"
            echo "    Set the secret to enable automatic registration on future runs."
            exit 0
          fi

          # /healthz returns {"version":..., "build":...} — no auth required
          BRIDGE_SHA=$(curl -sf "$BRIDGE_URL/healthz" | jq -r '.build // .version // "unknown"')

          HTTP_CODE=$(curl -sf -o /tmp/register-resp.json -w "%{http_code}" \
            -X POST https://api.hermeshq.net/internal/runtime-clusters/register \
            -H "Authorization: Bearer $BACKEND_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"clusterId\":          \"${{ inputs.cluster_id }}\",
              \"provider\":           \"hetzner\",
              \"provisioner\":        \"kube-hetzner\",
              \"bridgeUrl\":          \"$BRIDGE_URL\",
              \"runtimeBaseDomain\":  \"$RUNTIME_BASE_DOMAIN\",
              \"ingressIp\":          \"$INGRESS_IP\",
              \"bridgeVersion\":      \"$BRIDGE_SHA\",
              \"status\":             \"maintenance\"
            }")

          cat /tmp/register-resp.json
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Cluster registered (status=maintenance) — promote to active via admin API when ready"
          else
            echo "❌ Registration returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Run summary
        if: always()
        env:
          BRIDGE_URL: ${{ needs.bridge-deploy.outputs.bridge_url }}
          INGRESS_IP: ${{ steps.ip.outputs.ingress_ip }}
          RUNTIME_BASE_DOMAIN: ${{ needs.bridge-deploy.outputs.runtime_base_domain }}
        run: |
          echo "## Cluster ready: ${{ inputs.cluster_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bridge URL | \`$BRIDGE_URL\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ingress IP | \`$INGRESS_IP\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runtime domain | \`$RUNTIME_BASE_DOMAIN\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bridge status | maintenance (promote via admin API when ready) |" >> "$GITHUB_STEP_SUMMARY"
