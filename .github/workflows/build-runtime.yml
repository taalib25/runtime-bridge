name: Build & Deploy Runtime Image

on:
  push:
    branches: [main]
    paths:
      - "prod-hermes-docker-image/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-rollout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: prod-hermes-docker-image
          push: true
          build-args: |
            HERMES_AGENT_IMAGE=nousresearch/hermes-agent:latest
            HERMES_WEBUI_REF=main
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/runtime-node-core:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/runtime-node-core:sha-${{ github.sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 178.104.185.60 >> ~/.ssh/known_hosts

      - name: Pull new image on node and restart instance pods
        run: |
          ssh root@178.104.185.60 bash << 'EOF'
            set -euo pipefail
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            echo "=== Pulling runtime-node-core:latest ==="
            k3s ctr images pull \
              --user taalib25:${{ secrets.GHCR_PAT }} \
              ghcr.io/taalib25/runtime-node-core:latest

            echo "=== Rolling restart of all instance pods ==="
            KUBECONFIG=$KUBECONFIG kubectl get namespaces \
              -l hermeshq/managed-by=bridge \
              --no-headers -o custom-columns=':metadata.name' \
            | xargs -r -I{} \
                KUBECONFIG=$KUBECONFIG kubectl rollout restart deployment \
                  -n {} --ignore-not-found=true

            echo "=== Waiting for rollouts to complete ==="
            KUBECONFIG=$KUBECONFIG kubectl get namespaces \
              -l hermeshq/managed-by=bridge \
              --no-headers -o custom-columns=':metadata.name' \
            | xargs -r -I{} \
                KUBECONFIG=$KUBECONFIG kubectl rollout status deployment \
                  -n {} --timeout=120s 2>/dev/null || true

            echo "Done."
          EOF
