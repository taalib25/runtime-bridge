name: Build & Deploy Runtime Image

on:
  push:
    branches: [main]
    paths:
      - "prod-hermes-docker-image/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-rollout:
    runs-on: ubuntu-latest
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install Doppler CLI
        run: curl -Ls https://cli.doppler.com/install.sh | sh

      - name: Load secrets from Doppler
        run: doppler secrets download --no-file --format=env >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: prod-hermes-docker-image
          push: true
          build-args: |
            HERMES_AGENT_IMAGE=nousresearch/hermes-agent:latest
            HERMES_WEBUI_REF=master
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/runtime-node-core:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/runtime-node-core:sha-${{ github.sha }}

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Configure SSH via tunnel
        run: |
          mkdir -p ~/.ssh
          doppler secrets get SSH_PRIVATE_KEY --plain > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host ssh.hermes-test.hermeshq.net
            User root
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname ssh.hermes-test.hermeshq.net
          EOF

      - name: Pull new image on node and restart instance pods
        run: |
          ssh ssh.hermes-test.hermeshq.net bash << 'EOF'
            set -euo pipefail
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            echo "=== Pulling runtime-node-core:latest ==="
            k3s ctr images pull \
              --user taalib25:${GHCR_PAT} \
              ghcr.io/taalib25/runtime-node-core:latest

            echo "=== Rolling restart of all instance pods ==="
            NAMESPACES=$(KUBECONFIG=$KUBECONFIG kubectl get namespaces \
              -l hermeshq/managed-by=bridge \
              --no-headers -o custom-columns=':metadata.name' 2>/dev/null)
            if [ -z "$NAMESPACES" ]; then
              NAMESPACES=$(KUBECONFIG=$KUBECONFIG kubectl get namespaces \
                --no-headers -o custom-columns=':metadata.name' \
                | grep '^ws-')
            fi

            echo "$NAMESPACES" | xargs -r -I{} \
                KUBECONFIG=$KUBECONFIG kubectl rollout restart deployment \
                  -n {} --ignore-not-found=true

            echo "=== Waiting for rollouts to complete ==="
            echo "$NAMESPACES" | xargs -r -I{} \
                KUBECONFIG=$KUBECONFIG kubectl rollout status deployment \
                  -n {} --timeout=120s 2>/dev/null || true

            echo "Done."
          EOF
