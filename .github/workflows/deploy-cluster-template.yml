# Copy this file and rename it e.g. deploy-cluster-eu-2.yml
# Then create a GitHub Environment named "cluster-eu-2" with ONE secret:
#   DOPPLER_TOKEN — a Doppler service token scoped to config "prd_cluster-eu-2"
#
# In Doppler, create config "prd_cluster-eu-2" (inherits from "prd") and add:
#   NODE_IP, SSH_PRIVATE_KEY, BRIDGE_SECRET, CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
# Shared secrets (GHCR_PAT, ADMIN_API_SECRET) are inherited from the "prd" config automatically.
#
# Also create a Cloudflare Tunnel and route ssh.cluster-eu-2.hermeshq.net to it.
# See docs/multi-cluster-architecture.md for full setup steps.
#
# Trigger manually via Actions → "Deploy cluster-eu-2" → Run workflow
# or add 'push: branches: [main]' to auto-deploy on every merge.

name: Deploy cluster-eu-2

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-bridge.yml
    with:
      cluster_name: cluster-eu-2   # must match BRIDGE_CLUSTER_NAME in the env
      region: eu                    # eu | us | ap | etc.
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
