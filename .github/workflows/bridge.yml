name: Bridge CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run bridge unit tests
        run: go test ./bridge/... -v -count=1 -timeout 60s

      - name: Vet
        run: go vet ./bridge/...

  deploy-hermes-test:
    name: Deploy → hermes-test
    needs: test
    if: github.event_name == 'push'
    uses: ./.github/workflows/_deploy-bridge.yml
    with:
      cluster_name: hermes-test
      region: eu
    secrets:
      NODE_IP: ${{ secrets.HETZNER_NODE_IP }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
