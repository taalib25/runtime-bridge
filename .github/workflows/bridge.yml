name: Bridge CI/CD

on:
  push:
    branches: [main, go-bridge]
  pull_request:
    branches: [main, go-bridge]

jobs:
  # ── Phase 1: Unit tests + lint (runs on every PR and push) ──────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run bridge unit tests
        run: go test ./bridge/... -v -count=1 -timeout 60s

      - name: Vet
        run: go vet ./bridge/...

  # ── Phase 2: Build + deploy (only on push to main/go-bridge) ────────────────
  deploy:
    name: Build & deploy to k3s
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 178.104.185.60 >> ~/.ssh/known_hosts

      - name: Build image
        run: docker build -t hermes-bridge:latest --build-arg GIT_SHA=$(git rev-parse --short HEAD) .

      - name: Load image into k3s
        run: |
          docker save hermes-bridge:latest | \
            ssh root@178.104.185.60 "k3s ctr images import -"

      - name: Pre-pull hermes-agent on node
        run: |
          ssh root@178.104.185.60 \
            "k3s ctr images pull docker.io/nousresearch/hermes-agent:latest"

      - name: Apply manifests
        run: |
          scp deploy/rbac.yaml root@178.104.185.60:/tmp/rbac.yaml
          scp deploy/service.yaml root@178.104.185.60:/tmp/service.yaml
          scp deploy/deployment-test.yaml root@178.104.185.60:/tmp/deployment-test.yaml
          ssh root@178.104.185.60 "
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f /tmp/rbac.yaml
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f /tmp/service.yaml
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f /tmp/deployment-test.yaml
          "

      # - name: Apply monitoring stack (disabled — re-enable when needed)
      #   run: |
      #     scp deploy/monitoring/*.yaml root@178.104.185.60:/tmp/
      #     ssh root@178.104.185.60 bash << 'SSHEOF'
      #       export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
      #       kubectl apply -f /tmp/namespace.yaml
      #       kubectl apply -f /tmp/prometheus-rbac.yaml
      #       kubectl apply -f /tmp/prometheus-pvc.yaml
      #       kubectl apply -f /tmp/prometheus-config.yaml
      #       kubectl apply -f /tmp/prometheus-deployment.yaml
      #       kubectl apply -f /tmp/prometheus-service.yaml
      #       kubectl apply -f /tmp/grafana-secret.yaml
      #       kubectl apply -f /tmp/grafana-datasource.yaml
      #       kubectl apply -f /tmp/grafana-dashboard-provisioner.yaml
      #       kubectl apply -f /tmp/grafana-dashboard-hermes.yaml
      #       kubectl apply -f /tmp/grafana-pvc.yaml
      #       kubectl apply -f /tmp/grafana-deployment.yaml
      #       kubectl apply -f /tmp/grafana-service.yaml
      #       kubectl apply -f /tmp/grafana-ingress.yaml
      #     SSHEOF

      - name: Restart & wait for rollout
        run: |
          ssh root@178.104.185.60 "
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl rollout restart deployment/hermes-bridge -n hermes-bridge
            KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl rollout status deployment/hermes-bridge -n hermes-bridge --timeout=120s
          "

      - name: Smoke test
        run: |
          ssh root@178.104.185.60 bash << 'EOF'
            SECRET=$(KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n hermes-bridge get secret bridge-auth -o jsonpath='{.data.secret}' | base64 -d)

            echo "=== /healthz ==="
            curl -sf -H "Host: bridge.hermeshq.net" http://localhost/healthz | grep '"status":"ok"'

            echo "=== /readyz ==="
            curl -sf -H "Host: bridge.hermeshq.net" http://localhost/readyz | grep '"status":"ready"'

            echo "=== /v1/workspaces (auth) ==="
            curl -sf -H "Host: bridge.hermeshq.net" -H "X-Bridge-Secret: $SECRET" http://localhost/v1/workspaces | grep '"items"'

            echo "All smoke tests passed."
          EOF
