name: Bridge CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run bridge unit tests
        run: go test ./bridge/... -v -count=1 -timeout 60s

      - name: Vet
        run: go vet ./bridge/...

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check runtime image pull policy and digest pin
        run: |
          pip install pyyaml
          bash scripts/check-runtime-image-policy.sh

  build:
    name: Build bridge image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: taalib25
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push bridge image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/taalib25/hermes-bridge:${{ steps.tag.outputs.sha }}
            ghcr.io/taalib25/hermes-bridge:latest
          build-args: GIT_SHA=${{ steps.tag.outputs.sha }}
          cache-from: type=registry,ref=ghcr.io/taalib25/hermes-bridge:buildcache
          cache-to: type=registry,ref=ghcr.io/taalib25/hermes-bridge:buildcache,mode=max

  deploy-hermes-test:
    name: Deploy → hermes-test
    needs: build
    if: github.event_name == 'push'
    uses: ./.github/workflows/_deploy-bridge.yml
    with:
      cluster_name: hermes-test
      region: eu
      git_sha: ${{ needs.build.outputs.sha }}
    secrets:
      NODE_IP: ${{ secrets.HETZNER_NODE_IP }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
