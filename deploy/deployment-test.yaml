apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-bridge
  namespace: hermes-bridge
  labels:
    app.kubernetes.io/name: hermes-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-bridge
    spec:
      serviceAccountName: hermes-bridge
      containers:
        - name: bridge
          image: hermes-bridge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BRIDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: bridge-auth
                  key: secret
            - name: BRIDGE_CLUSTER_NAME
              value: "hermes-test"
            - name: BRIDGE_NAMESPACE
              value: "default"
            - name: CHART_PATH
              value: /charts/hermes-agent
            - name: SYNC_INTERVAL
              value: "5m"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: charts
              mountPath: /charts
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: charts
          configMap:
            name: hermes-agent-chart
      terminationGracePeriodSeconds: 30
