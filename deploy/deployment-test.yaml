apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-bridge
  namespace: hermes-bridge
  labels:
    app.kubernetes.io/name: hermes-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-bridge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: hermes-bridge
      containers:
        - name: bridge
          image: hermes-bridge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BRIDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: bridge-auth
                  key: secret
            - name: BRIDGE_CLUSTER_NAME
              value: "hermes-test"
            - name: BRIDGE_NAMESPACE
              value: "default"
            - name: BRIDGE_CHART_PATH
              value: /charts/hermes-agent
            - name: BRIDGE_SYNC_INTERVAL
              value: "5m"
            - name: BRIDGE_FORWARD_AUTH_URL
              value: "https://api.hermeshq.net/api/client/auth/verify"
            - name: BRIDGE_CORS_ORIGINS
              value: "https://hermes-hut-client.vercel.app,http://localhost:3002"
            - name: BRIDGE_DEFAULT_DOMAIN
              value: "hermeshq.net"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
