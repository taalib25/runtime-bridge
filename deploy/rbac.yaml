apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-bridge
  namespace: hermes-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-bridge
rules:
  - apiGroups: [""]
    resources: ["namespaces", "secrets", "configmaps", "pods", "services", "persistentvolumeclaims", "serviceaccounts", "events", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Read-only: the bridge never creates/manages Endpoints/EndpointSlices itself (they're
  # auto-populated by the Service/EndpointSlice controllers) — only diagnoses them.
  # Missing "endpoints" here silently breaks hasEndpoints diagnostics with a swallowed
  # 403, not a visible error, since Get()/List() calls just return an error the caller
  # treats as "no endpoints" instead of "couldn't check".
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io", "traefik.containo.us"]
    resources: ["middlewares", "ingressroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-bridge
subjects:
  - kind: ServiceAccount
    name: hermes-bridge
    namespace: hermes-bridge