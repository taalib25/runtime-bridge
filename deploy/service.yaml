apiVersion: v1
kind: Service
metadata:
  name: hermes-bridge
  namespace: hermes-bridge
  labels:
    app.kubernetes.io/name: hermes-bridge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes-bridge
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP