apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-bridge
  namespace: hermes-bridge
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: bridge-__CLUSTER_NAME__.hermeshq.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-bridge
                port:
                  number: 80
