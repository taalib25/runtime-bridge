apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-bridge
  namespace: hermes-bridge
  labels:
    app.kubernetes.io/name: hermes-bridge
    app.kubernetes.io/part-of: hermes-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-bridge
    spec:
      serviceAccountName: hermes-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: hermes-bridge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BRIDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: bridge-auth
                  key: secret
            - name: KUBECONFIG
              value: /etc/kubernetes/kubeconfig
            - name: CHART_PATH
              value: /charts/hermes-agent
            - name: CLUSTER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['topology.kubernetes.io/zone']
            - name: LOG_LEVEL
              value: "info"
            - name: SYNC_INTERVAL
              value: "5m"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kubernetes
              readOnly: true
            - name: charts
              mountPath: /charts
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: kubeconfig
          secret:
            secretName: bridge-kubeconfig
            defaultMode: 0400
        - name: charts
          configMap:
            name: hermes-agent-chart
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: hermes-bridge
                topologyKey: kubernetes.io/hostname