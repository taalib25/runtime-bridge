apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-bridge
  namespace: hermes-bridge
  labels:
    app.kubernetes.io/name: hermes-bridge
    app.kubernetes.io/part-of: hermes-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-bridge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: hermes-bridge
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: bridge
          image: ghcr.io/taalib25/hermes-bridge:__BRIDGE_IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BRIDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: bridge-auth
                  key: secret
            - name: BRIDGE_CLUSTER_NAME
              value: "__CLUSTER_ID__"
            - name: BRIDGE_NAMESPACE
              value: "__BRIDGE_NAMESPACE__"
            - name: BRIDGE_CHART_PATH
              value: /charts/hermes-agent
            - name: BRIDGE_DEFAULT_DOMAIN
              value: "__RUNTIME_BASE_DOMAIN__"
            - name: BRIDGE_CORS_ORIGINS
              value: "https://hermes-hut-client.vercel.app,http://localhost:3000,http://localhost:3001"
            - name: BRIDGE_SYNC_INTERVAL
              value: "5m"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
