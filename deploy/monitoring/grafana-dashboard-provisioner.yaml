apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioner
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: hermes
        folder: Hermes
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
