apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hermes
  namespace: monitoring
data:
  hermes.json: |
    {
      "title": "Hermes Bridge",
      "uid": "hermes-bridge",
      "schemaVersion": 38,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "cluster",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(hermes_bridge_workspace_count, cluster)",
            "refresh": 2,
            "includeAll": true,
            "multi": false,
            "label": "Cluster"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Total Workspaces",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "hermes_bridge_workspace_count{cluster=~\"$cluster\"}",
              "legendFormat": "total"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Healthy Workspaces",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "sum(hermes_bridge_workspace_health{cluster=~\"$cluster\"} == 1)",
              "legendFormat": "healthy"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "thresholds": {
              "steps": [
                { "color": "red", "value": null },
                { "color": "green", "value": 1 }
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Unhealthy Workspaces",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [
            {
              "expr": "sum(hermes_bridge_workspace_health{cluster=~\"$cluster\"} == 0) or vector(0)",
              "legendFormat": "unhealthy"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "thresholds": {
              "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 1 }
              ]
            }
          }
        },
        {
          "id": 4,
          "type": "table",
          "title": "Per-Workspace Health",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 8 },
          "targets": [
            {
              "expr": "hermes_bridge_workspace_health{cluster=~\"$cluster\"}",
              "legendFormat": "{{workspace_id}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Value" },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "0": { "text": "Unhealthy", "color": "red" }, "1": { "text": "Healthy", "color": "green" } } }
                    ]
                  },
                  { "id": "custom.displayMode", "value": "color-background" }
                ]
              }
            ]
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Operation Rates",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (operation, result) (rate(hermes_bridge_operation_total{cluster=~\"$cluster\"}[5m]))",
              "legendFormat": "{{operation}}/{{result}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "heatmap",
          "title": "Operation Latency Heatmap",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (le) (rate(hermes_bridge_operation_latency_seconds_bucket{cluster=~\"$cluster\"}[5m]))",
              "legendFormat": "{{le}}",
              "format": "heatmap"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Bridge HTTP Request Rate",
          "gridPos": { "x": 0, "y": 20, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (method, path, status_code) (rate(hermes_bridge_http_requests_total[5m]))",
              "legendFormat": "{{method}} {{path}} {{status_code}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Bridge HTTP P95 Latency by Path",
          "gridPos": { "x": 12, "y": 20, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (path, le) (rate(hermes_bridge_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95 {{path}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Tenant Pod CPU Usage",
          "gridPos": { "x": 0, "y": 28, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~\"tenant-.*\", container!=\"\"}[5m]))",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Tenant Pod Memory Usage",
          "gridPos": { "x": 12, "y": 28, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~\"tenant-.*\", container!=\"\"})",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        }
      ]
    }
