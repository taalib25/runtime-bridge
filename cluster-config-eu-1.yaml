# Hermes EU-1 Runtime Cluster — hetzner-k3s config template
#
# Single-node k3s cluster for production EU runtime capacity.
# Node: Falkenstein (Germany), cpx31 (4 vCPU, 8 GB RAM, 160 GB disk)
#
# Before provisioning, embed the node cleanup installer (requires P1 merged):
#   render-cluster-config.sh cluster-config-eu-1.yaml cluster-config-eu-1.rendered.yaml
#   provision-cluster.sh cluster-config-eu-1.rendered.yaml hermes-eu-1 eu
#
# If P1 is not yet merged, provision without render (cleanup added later):
#   provision-cluster.sh cluster-config-eu-1.yaml hermes-eu-1 eu

hetzner_token: "${HCLOUD_TOKEN}"
cluster_name: hermes-eu-1
kubeconfig_path: "./kubeconfig-eu-1"
k3s_version: v1.32.0+k3s1

networking:
  ssh:
    port: 22
    use_agent: false
    public_key_path: "~/.ssh/id_ed25519.pub"
    private_key_path: "~/.ssh/id_ed25519"
  allowed_networks:
    ssh:
      - 0.0.0.0/0
    api:
      - 0.0.0.0/0
    http:
      - 0.0.0.0/0
    https:
      - 0.0.0.0/0
  public_network:
    ipv4: true
    ipv6: false
  private_network:
    enabled: false

  cni:
    enabled: true
    encryption: false
    mode: flannel

datastore:
  mode: etcd

# Single node — master runs all workloads (bridge + agent instances)
schedule_workloads_on_masters: true

masters_pool:
  instance_type: cpx31  # 4 vCPU, 8 GB RAM — headroom for concurrent agent instances
  instance_count: 1
  locations:
    - fsn1  # Falkenstein, Germany

worker_node_pools: []

addons:
  csi_driver:
    enabled: true
    manifest_url: "https://raw.githubusercontent.com/hetznercloud/csi-driver/v2.20.2/deploy/kubernetes/hcloud-csi.yml"

  cloud_controller_manager:
    enabled: true
    manifest_url: "https://github.com/hetznercloud/hcloud-cloud-controller-manager/releases/download/v1.30.1/ccm-networks.yaml"

  traefik:
    enabled: true

  servicelb:
    enabled: true

  metrics_server:
    enabled: true

create_load_balancer_for_the_kubernetes_api: false

protect_against_deletion: true

