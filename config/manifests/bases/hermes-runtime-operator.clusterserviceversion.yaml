apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |
      [
        {
          "apiVersion": "hermes.hermeshq.net/v1alpha1",
          "kind": "Runtime",
          "metadata": {
            "name": "sample-runtime"
          },
          "spec": {
            "tenantId": "sample-tenant",
            "runtimeId": "sample-runtime",
            "image": "nousresearch/hermes-agent:latest",
            "plan": {
              "cpuMillis": 1000,
              "memoryMi": 2048
            },
            "storage": {
              "sizeGi": 10,
              "storageClassName": "local-path"
            },
            "network": {
              "mode": "subdomain",
              "host": "hermeshq.net",
              "subdomain": "sample-runtime",
              "ingressClassName": "traefik"
            },
            "config": {
              "model": {
                "provider": "auto",
                "default": "anthropic/claude-opus-4.6",
                "base_url": "https://openrouter.ai/api/v1"
              }
            },
            "soul": "# Hermes Runtime\n\nYou are a helpful assistant."
          }
        }
      ]
    capabilities: Basic Install
  name: hermes-runtime-operator.v0.1.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
    - kind: Runtime
      name: runtimes.hermes.hermeshq.net
      version: v1alpha1
      displayName: Hermes Runtime
      description: Represents a single Hermes agent runtime and the desired configuration used to reconcile its Kubernetes workload and public endpoint.
  description: |
    Hermes Runtime Operator manages per-runtime Hermes agent workloads through a Runtime custom resource.
    It reconciles Deployments, Services, Ingresses, PVCs, ConfigMaps, and managed Secrets while exposing
    a compatibility HTTP API that external backends can use for runtime lifecycle operations.
  displayName: Hermes Runtime Operator
  icon:
  - base64data: PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTIiIGZpbGw9IiMxMTE4MjciLz48cGF0aCBkPSJNMTggMTRoMTB2MTdoOFYxNGgxMHYzNkgzNlY0MGgtOHYxMEgxOHoiIGZpbGw9IiM2MEE1RkEiLz48L3N2Zz4=
    mediatype: image/svg+xml
  install:
    spec:
      deployments: null
    strategy: ""
  installModes:
  - supported: true
    type: OwnNamespace
  - supported: true
    type: SingleNamespace
  - supported: false
    type: MultiNamespace
  - supported: true
    type: AllNamespaces
  keywords:
  - hermes
  - runtime
  - operator
  - ai-agent
  links:
  - name: Hermes Runtime Operator
    url: https://github.com/hermeshq/hermes-runtime-operator
  maintainers:
  - email: opensource@hermeshq.net
    name: HermesHQ
  maturity: alpha
  minKubeVersion: 1.30.0
  provider:
    name: HermesHQ
    url: https://hermeshq.net
  version: 0.1.0
