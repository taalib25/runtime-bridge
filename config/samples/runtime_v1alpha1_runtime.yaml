apiVersion: hermes.hermeshq.net/v1alpha1
kind: Runtime
metadata:
  name: test-runtime
  namespace: hermes-prod
spec:
  tenantId: "test-tenant"
  runtimeId: "test-runtime"
  image: "nousresearch/hermes-agent:latest"
  plan:
    cpuMillis: 1000
    memoryMi: 2048
  storage:
    sizeGi: 10
    storageClassName: "local-path"
  network:
    mode: "subdomain"
    host: "hermeshq.net"
    subdomain: "test-runtime"
    ingressClassName: "traefik"
  config:
    model:
      provider: auto
      default: anthropic/claude-opus-4.6
      base_url: https://openrouter.ai/api/v1
    agent:
      max_turns: 90
      gateway_timeout: 1800
  soul: |
    # Hermes Runtime

    You are a helpful assistant.
  env:
    - name: "APP_ENV"
      value: "test"
