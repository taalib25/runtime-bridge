                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deploymentName:
                description: DeploymentName is the name of the managed Deployment.
                type: string
              desiredReplicas:
                description: DesiredReplicas is the desired number of replicas in
