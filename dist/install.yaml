                      minLength: 0
                      type: string
                  required:
                  - name
                  - value
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              envFromSecrets:
                description: |-
                  EnvFromSecrets lists Secrets that already exist in the runtime namespace and
