              image:
                description: |-
                  Image is the fully qualified OCI image reference for the runtime workload.
                  Prefer immutable tags or digests.
                maxLength: 512
                minLength: 1
                type: string
              network:
                description: Network controls ingress exposure.
                properties:
                  host:
                    description: |-
                      Host is the base hostname for the runtime.
                      For path mode: runtime.hermescloud.app
                      For subdomain mode: hermescloud.app
                    maxLength: 253
                    minLength: 1
                    type: string
                  ingressClassName:
                    description: IngressClassName specifies the IngressClass to use.
                    type: string
                  mode:
                    description: Mode controls how the runtime is exposed.
                    enum:
                    - path
                    - subdomain
                    type: string
                  path:
                    description: |-
                      Path is the URL path for path mode (e.g., /rt-123).
                      Required when mode is "path", ignored when mode is "subdomain".
                    type: string
                  subdomain:
                    description: |-
                      Subdomain is the subdomain prefix for subdomain mode (e.g., rt-123).
                      Required when mode is "subdomain", ignored when mode is "path".
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - host
                - mode
                type: object
              plan:
                description: Plan controls runtime CPU and memory limits.
                properties:
                  cpuMillis:
                    description: CPUMillis is the CPU limit in milli-cores (e.g.,
