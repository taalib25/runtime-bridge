              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Runtime
            properties:
              config:
                description: Config is rendered into /opt/data/config.yaml.
                x-kubernetes-preserve-unknown-fields: true
              env:
                description: Env defines non-secret environment variables to inject
